spring.application.name=barista-service

spring.kafka.bootstrap-servers=localhost:9092

# группа читателей: Kafka запомнит, докуда бариста дочитал
spring.kafka.consumer.group-id=barista
# новая группа начинает с начала журнала: бариста приготовит всё, что накопилось
spring.kafka.consumer.auto-offset-reset=earliest

# ключ - строка, значение - JSON
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# в JSON нет имени класса, поэтому указываем, во что его превращать
spring.kafka.consumer.properties.spring.json.value.default.type=io.github.xoage.barista.events.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=io.github.xoage.barista.events

# отправка событий: ключ - строка, значение - JSON без имени Java-класса
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# сколько бариста «готовит» один заказ
barista.preparation-time=5s