spring.application.name=order-service
server.port=8081

spring.datasource.url=jdbc:postgresql://127.0.0.1:15433/orders
spring.datasource.username=orders
spring.datasource.password=${ORDERS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092

spring.mvc.problemdetails.enabled=true


# ключ сообщения - строка (id заказа), значение - JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# не добавлять в сообщение имя Java-класса: контракт между сервисами - JSON
spring.kafka.producer.properties.spring.json.add.type.headers=false

# чтение событий о статусе заказов
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=io.github.xoage.orders.events.OrderStatusChangedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=io.github.xoage.orders.events